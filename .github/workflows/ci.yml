# The server and the tray app on every platform (ADR-009): build, Rust tests, fmt/clippy, the
# smoke suite and the browser suites. CI runners have no audio device; the playback tests need
# one, so each runner gets a virtual one. The loopback audio suites are run by hand.
name: CI

on:
  push:
    branches: [main, rust-port]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/app
            rust/tray
      - name: Linux packages (ALSA; WebKitGTK and appindicator for the tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev lsof
      - name: Linux - a virtual audio device (the runner has none; the playback tests need one)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio libasound2-plugins alsa-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
          aplay -L | head -20
      - name: Windows - a virtual audio device (Scream; the runner has none)
        if: runner.os == 'Windows'
        uses: LABSN/sound-ci-helpers@v1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fetch:ffmpeg
      - run: npm run build
      - name: Stage the server as the tray's sidecar (tauri-build checks it exists)
        run: node scripts/stage-sidecar.js
      - name: The server starts and answers (its output, for the first runs on a platform)
        shell: bash
        run: |
          bin=rust/app/target/release/accompaniment
          PORT=3399 ACCOMPANIMENT_DATA_DIR="$RUNNER_TEMP/accompaniment-start" "$bin" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3399/api/remote/health > /dev/null; then ok=1; break; fi
            sleep 0.5
          done
          curl -s http://127.0.0.1:3399/api/audio/output-devices || true
          echo
          kill $pid 2>/dev/null || true
          sleep 1
          echo "--- server output:"
          cat "$RUNNER_TEMP/server.log"
          [ -n "$ok" ] || { echo "the server did not answer in 30 s"; exit 1; }
      - name: fmt and clippy
        shell: bash
        run: |
          for crate in rust/app rust/tray; do
            (cd $crate && cargo fmt --check && cargo clippy --release --all-targets -- -D warnings)
          done
      - run: npm run test:unit
      - run: npm run test:smoke
        if: success() || failure()   # every suite reports, even after another failed
      - run: npm run test:e2e
        if: success() || failure()   # every suite reports, even after another failed
      - name: Keep the Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
