[request]
method = "POST"
path = "/api/audio/upload?case=2034"
body = """
--rustanythingboundary\r
Content-Disposition: form-data; name="file"; filename="x.wav"\r
Content-Type: application/octet-stream\r
\r
x\r
--rustanythingboundary--\r
"""

[request.headers]
content-type = "multipart/form-data; boundary=rustanythingboundary"

[response]
status = 400

[response.headers]
access-control-allow-credentials = "true"
content-type = "application/json; charset=utf-8"
vary = "Origin"
