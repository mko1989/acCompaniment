[request]
method = "POST"
path = "/api/remote/master-volume?case=2020"
body = '{"volume":"loud"}'

[request.headers]
content-type = "application/json"

[response]
status = 400

[response.headers]
access-control-allow-credentials = "true"
content-type = "application/json; charset=utf-8"
vary = "Origin"
