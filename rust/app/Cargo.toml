[package]
name = "accompaniment"
version = "0.1.0"
edition = "2024"
publish = false
description = "acCompaniment soundboard server (rust/DECISIONS.md)"

[lib]
name = "accompaniment"
path = "src/lib.rs"

[[bin]]
name = "accompaniment"
path = "src/main.rs"

# Decodes one file as the engine does (debugging).
[[bin]]
name = "decode-file"
path = "src/bin/decode_file.rs"

# Output devices as the Rust engine lists them (B4).
[[bin]]
name = "list-devices"
path = "src/bin/list_devices.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
form_urlencoded = "1"
httpdate = "1"
multer = "3"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
hex = "0.4"
indexmap = "2"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
cpal = "0.18"
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "vorbis", "ogg", "mp3", "aiff", "adpcm"] }
rubato = "5.1"
audioadapter-buffers = "5.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["net", "signal"] }

[workspace]
