[package]
name = "accompaniment"
version = "0.1.0"
edition = "2024"
publish = false
description = "acCompaniment server (Rust port, rust/DECISIONS.md). Front door scaffolded by rust-anything: Rust owns the server, the original answers what is not ported yet"

[lib]
name = "accompaniment"
path = "src/lib.rs"

[[bin]]
name = "accompaniment"
path = "src/main.rs"

# Differential check of the core's data layer against the Node original (rust/scripts/diff-data.js).
[[bin]]
name = "drive-data"
path = "src/bin/drive_data.rs"

[dependencies]
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hex = "0.4"
indexmap = "2"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[workspace]
